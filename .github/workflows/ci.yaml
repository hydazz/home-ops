---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.6.5"
  # renovate: datasource=custom.talos-factory depName=siderolabs/talos
  TALOS_VERSION: v1.14.5
  # renovate: datasource=github-releases depName=jdx/jactionlint
  JACTIONLINT_VERSION: v2.3.0

jobs:
  image-pull-extract:
    if: ${{ github.event_name == 'pull_request' }}
    name: Image Pull - Extract Images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install: false

      - name: Extract Images
        id: extract
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          mise exec "github:home-operations/flate@${FLATE_VERSION}" -- flate diff images -p ./kubernetes/flux/cluster --allow-missing-secrets -o json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  image-pull:
    if: >-
      ${{
        needs.image-pull-extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: image-pull-extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(needs.image-pull-extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install: false

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec "talosctl@${TALOS_VERSION}" -- talosctl --nodes "$NODE" image pull "$IMAGE"

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install: false

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec "aqua:jdx/jactionlint@${JACTIONLINT_VERSION}" -- jactionlint --online --shellcheck= --format github

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - image-pull-extract
      - image-pull
      - workflow-lint
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
