---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: crowdsec-secret
    template:
      data:
        # LAPI registers a bouncer named after each BOUNCER_KEY_<name> on start when it is missing
        BOUNCER_KEY_appsec: "{{ .ENVOY_APPSEC_BOUNCER_KEY }}"
        BOUNCER_KEY_envoy: "{{ .ENVOY_BOUNCER_KEY }}"
        CROWDSEC_LAPI_SECRET: "{{ .CROWDSEC_LAPI_SECRET }}"
        DB_HOST: postgres-rw.databases.svc.cluster.local
        DB_NAME: crowdsec
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
        DB_USERNAME: "{{ .DB_USERNAME }}"
        REGISTRATION_TOKEN: "{{ .REGISTRATION_TOKEN }}"
  dataFrom:
    - extract:
        key: crowdsec
