---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  interval: 1h
  # The chart's values schema does not list the kubernetes datasource used in agent.additionalAcquisition
  install:
    disableSchemaValidation: true
  upgrade:
    disableSchemaValidation: true
  values:
    container_runtime: containerd
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    secrets:
      externalSecret:
        name: crowdsec-secret
        csLapiSecretKey: CROWDSEC_LAPI_SECRET
        registrationTokenKey: REGISTRATION_TOKEN
    config:
      parsers:
        s02-enrich:
          envoy-418-whitelist.yaml: |-
            name: hydaz/envoy-418-whitelist
            description: "Whitelist 418 responses from the envoy bouncer to prevent processing already banned IPs"
            filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
            whitelist:
              reason: "envoy bouncer response to already banned ips"
              expression:
                - "evt.Meta.http_status == '418'"
          wordpress-api-whitelist.yaml: |-
            name: hydaz/wordpress-api-whitelist
            description: "Whitelist legitimate WordPress API calls"
            filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
            whitelist:
              reason: "legitimate wordpress api call"
              expression:
                - "evt.Meta.http_path contains '/wp-json/wp/v2/posts' && evt.Meta.http_path contains 'context=edit' && evt.Meta.http_status == '200'"
      config.yaml.local: |-
        api:
          server:
            auto_registration:
              enabled: true
              token: "${REGISTRATION_TOKEN}"
              allowed_ranges:
                - 10.42.0.0/16
        db_config:
          type: postgresql
          user: ${DB_USERNAME}
          password: ${DB_PASSWORD}
          db_name: ${DB_NAME}
          host: ${DB_HOST}
          port: 5432
          flush:
            agents_autodelete:
              login_password: 168h
            bouncers_autodelete:
              api_key: 168h
      console.yaml: |-
        share_manual_decisions: false
        share_custom: false
        share_tainted: false
        share_context: false
      profiles.yaml: |-
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 24h
        on_success: break
    lapi:
      strategy:
        type: RollingUpdate
      storeLAPICscliCredentialsInSecret: true
      env:
        - name: TZ
          value: Australia/Melbourne
      envFrom:
        - secretRef:
            name: crowdsec-secret
      persistentVolume:
        data:
          enabled: false
        config:
          enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: null # the chart defaults to a 500m limit
          memory: 512Mi
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      isDeployment: true
      strategy:
        type: RollingUpdate
      serviceAccountName: crowdsec-agent
      hostVarLog: false
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name in (envoy-cloudflare,envoy-external)
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: >-
            yanis-kouidri/envoy
            crowdsecurity/http-cve
            crowdsecurity/plex
            crowdsecurity/wordpress
        - name: SCENARIOS
          value: crowdsecurity/http-bf-wordpress_bf_xmlrpc
        - name: TZ
          value: Australia/Melbourne
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: null
          memory: 512Mi
      metrics:
        serviceMonitor:
          enabled: true
    appsec:
      enabled: true
      replicas: 2
      strategy:
        type: RollingUpdate
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    k8s-app: crowdsec
                    type: appsec
      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          appsec_config: crowdsecurity/appsec-default
          labels:
            type: appsec
      env:
        - name: APPSEC_CONFIGS
          value: crowdsecurity/appsec-default
        - name: COLLECTIONS
          value: >-
            crowdsecurity/appsec-generic-rules
            crowdsecurity/appsec-virtual-patching
            crowdsecurity/appsec-wordpress
        - name: TZ
          value: Australia/Melbourne
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: null
          memory: 256Mi
      metrics:
        serviceMonitor:
          enabled: true
